app:
  name: "OneWay Support Bot"
  version: "2.0.0"
  environment: "development"

bot:
  token: "${BOT_TOKEN}"
  channel_id: ${CHANNEL_ID}
  supergroup_id: ${SUPERGROUP_ID}
  webhook:
    enabled: false
    url: ""
    port: 8080
  rate_limit:
    requests_per_minute: 30

database:
  uri: "${DATABASE_URI}"
  name: "oneway_support"
  timeout: 30s
  max_pool_size: 100
  min_pool_size: 5
  max_idle_time: 5m

logging:
  level: "info"
  format: "json"
  file: "logs/bot.log"
  max_size: 100  # MB
  max_backups: 3
  max_age: 28    # days

redis:
  enabled: false
  uri: "${REDIS_URI}"
  db: 0
  password: "${REDIS_PASSWORD}"

monitoring:
  enabled: true
  metrics_port: 9090
  health_check_port: 8081

features:
  survey:
    enabled: true
    auto_send_after_close: true
    reminder_after: 1h
  notifications:
    enabled: true
    admin_chat_id: ${ADMIN_CHAT_ID}
  analytics:
    enabled: true
    daily_reports: true
